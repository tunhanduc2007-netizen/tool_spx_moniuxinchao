[project]
name = "tool-spx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Linh Ne", email = "tunhanduc2007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tool-spx = "tool_spx:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
