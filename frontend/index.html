<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Mon Iu Xin Chào!!!</title>
    
    <!-- iOS Safari Bookmark & Home Screen App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mon Iu Xin Chào!!!" />
    <meta name="application-name" content="Mon Iu Xin Chào!!!" />
    <meta name="theme-color" content="#FF5252" />
    
    <!-- Apple Touch Icons for iPhone Safari Bookmark & Home Screen -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />

    <!-- Standard Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Completely hide and suppress Netlify Badge / HUD -->
    <style>
      netlify-badge,
      netlify-hud,
      nl-badge,
      nl-hud,
      [data-netlify-site-id],
      .netlify-badge,
      .nl-badge,
      [class*="netlify-badge"],
      [id*="netlify-badge"],
      [class*="nl-badge"],
      [id*="nl-badge"],
      [class*="nl-hud"],
      [id*="nl-hud"],
      iframe[src*="netlify"],
      a[href*="netlify.com"],
      div:has(> a[href*="netlify.com"]),
      div:has(> [class*="netlify"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        top: -99999px !important;
        left: -99999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        try {
          class EmptyElement extends HTMLElement {
            connectedCallback() { this.remove(); }
          }
          customElements.define('netlify-badge', EmptyElement);
          customElements.define('netlify-hud', EmptyElement);
          customElements.define('nl-badge', EmptyElement);
          customElements.define('nl-hud', EmptyElement);
        } catch(e) {}
        var clean = function() {
          var nodes = document.querySelectorAll('netlify-badge, netlify-hud, nl-badge, nl-hud, [data-netlify-site-id], script[src*="netlify/scripts/hud"], iframe[src*="netlify"], .netlify-badge');
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].remove();
          }
        };
        if (window.MutationObserver) {
          new MutationObserver(clean).observe(document.documentElement, { childList: true, subtree: true });
        }
        document.addEventListener('DOMContentLoaded', clean);
        window.addEventListener('load', clean);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
