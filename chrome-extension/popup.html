<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      font-size: 10px;
      background: #ECFDF5;
      color: #059669;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .shop-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      height: 38px;
      background: #EE4D2D;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover {
      background: #D73211;
    }
    .link {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: #2563EB;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛍️</span>
    <div>
      <div style="font-weight: 800; font-size: 13px;">Mon Baby SPX Sync</div>
      <div style="font-size: 10px; color: #64748B;">Shopee Seller Auto Tool</div>
    </div>
  </div>

  <div class="shop-card">
    <div style="font-size: 10.5px; color: #64748B;">Gian hàng Shopee:</div>
    <div style="font-size: 12px; font-weight: 700; color: #0F172A; margin: 2px 0;">Mon Baby (NOUS Sơ Sinh)</div>
    <span class="badge">● Sẵn sàng đồng bộ đơn</span>
  </div>

  <button class="btn" id="openAppBtn">
    🚀 Mở App In Đơn Hàng Loạt
  </button>

  <a href="https://moniuxinchaospx.netlify.app" target="_blank" class="link">
    Truy cập web: moniuxinchaospx.netlify.app
  </a>

  <script src="popup.js"></script>
</body>
</html>
